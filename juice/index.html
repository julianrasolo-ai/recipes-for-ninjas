<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juice · Recipes for Ninjas</title>
<meta name="description" content="42 cold-pressed juices for the Ninja NeverClog juicer, searchable by ingredient and by benefit.">
<meta property="og:title" content="Juice · Recipes for Ninjas">
<meta property="og:description" content="42 cold-pressed juices for the Ninja NeverClog juicer, searchable by ingredient and by benefit.">
<meta property="og:image" content="/img/home/og.jpg">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script>
/* Images: local file first, then the CDN copy, then the emoji tile. Registered early so the hero is covered. */
document.addEventListener('error',function(e){
  var im=e.target; if(!im||im.tagName!=='IMG')return;
  if(im.dataset.cdn&&im.src.indexOf(im.dataset.cdn)<0){im.src=im.dataset.cdn;return}
  if(im.dataset.emo){var d=document.createElement('div');d.className='emo';d.textContent=im.dataset.emo;im.replaceWith(d)}
},true);
</script>
</head>
<body data-site="juice">
<a class="skip" href="#menu">Skip to recipes</a>

<header class="top">
  <a class="ibtn home" href="/" aria-label="Home">←</a>
  <div class="ttl"><p class="kick">Ninja NeverClog · 42 recipes</p><h1>🧃 Juice</h1></div>
  <a class="switch" href="/ice-cream/">🍦 Ice cream</a>
</header>

<main class="menu" id="menu" tabindex="-1">
  <div class="wrap">
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Search apple, ginger, energy…" aria-label="Search recipes" autocomplete="off">
      <div class="pills">
        <button class="pill fav" id="openFav" type="button"><span class="pe">❤️ </span><span class="pl">Favorites</span><span class="ps">Faves</span></button>
        <button class="pill have" id="openHave" type="button"><span class="pe">🧺 </span><span class="pl">What I have</span><span class="ps">I have</span></button>
        <button class="pill" id="healthyOnly" type="button" aria-pressed="false"><span class="pe">🌿 </span>Low sugar</button>
      </div>
    </div>
    <div class="bens" id="bens" hidden aria-label="Filter by benefit"></div>
    <nav class="nav" aria-label="Menu sections"><div class="navrow" id="navrow"></div></nav>
    <div id="sections"></div>
    <p class="empty" id="empty" hidden>No recipes match. Try another word.</p>
    <p class="foot">Turn the juicer on before adding food. Cut pieces to about 2 inches, peel citrus, pit stone fruit.<br>Black filter = less pulp, orange filter = lots of pulp. Drink within 24 hours.</p>
  </div>
</main>

<dialog class="sheet" id="sheet" aria-label="Recipe">
  <div class="sheet-in" id="sheetIn"></div>
</dialog>

<script>window.SITE={"key": "juice", "data": "/data/juice.json", "pantry": "", "haveNote": "Tap everything in your fridge and fruit bowl.", "focus": [["all", "Anything"], ["healthy", "🌿 Low sugar"], ["kids", "🧒 Kids"]], "haveColor": "green", "favColor": "fruit"};</script>
<script src="/assets/likes.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
