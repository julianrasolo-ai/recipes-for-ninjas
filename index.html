<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipes By Ninjas — What are we making?</title>
<!--SOCIAL-->
<meta name="theme-color" content="#fff4e8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#22174a;--muted:#6b5f8f;--pink:#ff4f9a;--mint:#14a77c;--cream:#fff4e8;--counter:#f3e6d6;--edge:#e6d2bd}
@media (prefers-color-scheme:dark){:root{--ink:#fbf7ff;--muted:#c9bfe6;--cream:#1d1630;--counter:#2c2342;--edge:#3b3058}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,.label b{font-family:"Fredoka","Nunito",system-ui,sans-serif}

.stage{position:relative;height:100vh;height:100dvh;overflow:hidden;isolation:isolate;--ch:calc(22vh + env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(44vmax 44vmax at 50% 46%,color-mix(in srgb,#fff 70%,var(--cream)) 0,transparent 70%),
    radial-gradient(70vmax 50vmax at 0% 0%,color-mix(in srgb,#ff4f9a 14%,var(--cream)) 0,transparent 60%),
    radial-gradient(70vmax 50vmax at 100% 10%,color-mix(in srgb,#14a77c 14%,var(--cream)) 0,transparent 60%),
    var(--cream)}

.head{position:absolute;z-index:30;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 16px);text-align:center;padding:0 16px;pointer-events:none}
.kicker{display:inline-block;background:color-mix(in srgb,#fff 92%,var(--cream));color:var(--pink);font:700 13px "Fredoka",sans-serif;padding:5px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(34,23,74,.08)}
h1{font-size:clamp(32px,8vw,72px);line-height:.95;margin:10px 0 0;letter-spacing:-.02em;text-wrap:balance}
h1 span{display:inline-block;animation:pop .7s cubic-bezier(.2,1.4,.4,1) backwards}
h1 span:nth-child(2){animation-delay:.08s;color:var(--pink)}
h1 span:nth-child(3){animation-delay:.16s;color:var(--mint)}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.95)}}
/* Ask Ninjas: the chef's speech bubble (dark glass, neon hairline, tail pointing at him) */
.askbox{pointer-events:auto;position:relative;display:flex;align-items:center;gap:8px;max-width:400px;margin:14px auto 0;padding:6px 6px 6px 14px;border-radius:22px;
  background:rgba(16,12,34,.86);color:#f4f1ff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 14px 34px rgba(16,12,34,.28);
  animation:pop .7s cubic-bezier(.2,1.4,.4,1) .3s backwards}
.askbox::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(120deg,#5ce1e6,transparent 45%,transparent 60%,#ff5fa2);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.askbox::after{content:"";position:absolute;left:50%;bottom:-9px;width:18px;height:18px;translate:-50% 0;rotate:45deg;background:rgba(16,12,34,.86);border-radius:0 0 5px 0}
.askbox .who{flex:none;font:700 12px "Fredoka",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#5ce1e6;display:flex;align-items:center;gap:6px}
.askbox .who i{width:7px;height:7px;border-radius:50%;background:#3ee6a4;box-shadow:0 0 8px #3ee6a4}
.askbox input{flex:1;min-width:0;border:0;background:transparent;font:16px "Nunito",sans-serif;color:#f4f1ff;padding:8px 4px;outline:none}
.askbox input::placeholder{color:#a79fcf}
.askbox button{flex:none;border:0;border-radius:50%;width:40px;height:40px;background:linear-gradient(135deg,#5ce1e6,#ff5fa2);color:#120d28;font-size:17px;font-weight:900;cursor:pointer}
.askbox:focus-within{box-shadow:0 0 0 3px rgba(92,225,230,.35),0 14px 34px rgba(16,12,34,.28)}
@media (max-width:420px){.askbox .who span{display:none}}
.search{position:absolute;z-index:31;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,#fff 92%,var(--cream));text-decoration:none;box-shadow:0 6px 18px rgba(34,23,74,.1)}

.sun{position:absolute;z-index:1;left:50%;top:47%;width:min(66vw,440px);aspect-ratio:1;border-radius:50%;translate:-50% -50%;
  background:radial-gradient(circle at 40% 35%,#fffaf2 0,#ffe6c9 55%,#ffd2b0 100%);box-shadow:0 30px 80px rgba(255,150,90,.25);opacity:.95}

/* chef: anchored, only breathes and leans; the fruit is what moves */
.chef{position:absolute;z-index:10;left:50%;top:47%;height:min(40vh,420px);width:auto;translate:-50% -50%;
  transform-origin:50% 92%;rotate:var(--lean,0deg);transition:rotate .5s cubic-bezier(.3,1.4,.5,1);
  animation:chefIn .9s cubic-bezier(.2,1.2,.4,1) .1s backwards, breathe 3.6s ease-in-out 1s infinite;filter:drop-shadow(0 24px 22px rgba(34,23,74,.2))}
div.chef{display:grid;place-items:center;font-size:min(20vh,180px);height:auto}
@keyframes chefIn{from{opacity:0;transform:translateY(50px) scale(.85)}}
@keyframes breathe{50%{transform:translateY(-6px) scale(1.015)}}
.chef.throw{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{30%{transform:translateY(-26px) scaleY(1.04)}60%{transform:translateY(4px) scaleY(.96)}}

/* orbiting ingredients: position is written by JS each frame */
.fl{position:absolute;z-index:5;left:0;top:0;width:var(--fs);height:auto;pointer-events:none;will-change:transform;opacity:0;transition:opacity .6s;filter:drop-shadow(0 10px 10px rgba(34,23,74,.18))}
.ready .fl{opacity:1}
.fl.back{filter:blur(1.2px) drop-shadow(0 6px 6px rgba(34,23,74,.12));opacity:.82}
div.fl{display:grid;place-items:center;font-size:calc(var(--fs)*.7);height:var(--fs)}
.stage{--fs:clamp(64px,18vmin,150px)}

/* counter + four machines */
.counter{position:absolute;left:-5%;right:-5%;bottom:0;height:var(--ch);background:linear-gradient(color-mix(in srgb,#fff 40%,var(--counter)),var(--counter));
  border-top:3px solid color-mix(in srgb,#fff 70%,var(--counter));box-shadow:0 -10px 40px rgba(120,80,40,.08), inset 0 3px 0 var(--edge)}
.machines{position:absolute;z-index:20;left:0;right:0;bottom:calc(var(--ch) - 2.2vh);display:grid;grid-template-columns:repeat(4,1fr);align-items:end;gap:1vw;padding:0 max(3vw,8px);pointer-events:none}
@media (min-width:900px){.machines{grid-template-columns:1fr 1fr 1.6fr 1fr 1fr;padding:0 5vw}.machines .gap{display:block}}
.machines .gap{display:none}
.machine{pointer-events:auto;position:relative;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink);outline:none;justify-self:center;width:100%;max-width:230px}
.machine .m{width:100%;height:auto;aspect-ratio:1;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;transition:transform .25s cubic-bezier(.3,1.5,.5,1);
  filter:drop-shadow(0 14px 12px rgba(34,23,74,.18));animation:rise .9s cubic-bezier(.2,1,.3,1) backwards;animation-delay:var(--d,.3s)}
.machine div.m{display:grid;place-items:center;font-size:min(13vw,110px)}
.machine:hover .m,.machine:focus-visible .m{transform:translateY(-6px) scale(1.05)}
.machine.go .m{animation:gulp .5s ease-in-out .5s 2}
@keyframes rise{from{opacity:0;transform:translateY(60px)}}
@keyframes gulp{30%{transform:scale(1.08,.94)}60%{transform:scale(.96,1.05)}}
.label{position:absolute;top:calc(100% + 3.2vh);display:flex;flex-direction:column;align-items:center;gap:1px;background:color-mix(in srgb,#fff 94%,var(--cream));border-radius:14px;padding:6px 10px;box-shadow:0 10px 24px rgba(34,23,74,.12);white-space:nowrap;transition:transform .2s}
.label b{font-size:clamp(14px,3.8vw,22px);font-weight:700;line-height:1}
.label small{font-size:11px;font-weight:800;color:var(--muted)}
.machine:focus-visible .label{outline:3px solid #2ba8ff;outline-offset:3px}
.machine:active .label{transform:scale(.96)}
.c-ice b{color:var(--pink)}.c-juice b{color:var(--mint)}.c-blender b{color:#7a5cff}.c-fire b{color:#e2552b}
@media (max-width:520px){.label small{display:none}.label{padding:5px 8px}}
.family{position:absolute;z-index:21;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);margin:0;text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.family{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 6px;padding:0 10px}
.family a{color:inherit;text-decoration:none;background:color-mix(in srgb,#fff 80%,var(--cream));border-radius:999px;padding:3px 9px;box-shadow:0 3px 10px rgba(34,23,74,.06)}
@media (max-width:420px){.family .x{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<script>
document.addEventListener('error',function(e){
  var im=e.target; if(!im||im.tagName!=='IMG')return;
  if(im.dataset.cdn&&im.src.indexOf(im.dataset.cdn)<0){im.src=im.dataset.cdn;return}
  if(im.dataset.emo){var d=document.createElement('div');d.className=im.className;d.id=im.id;d.style.cssText=im.style.cssText;for(var k in im.dataset)d.dataset[k]=im.dataset[k];d.textContent=im.dataset.emo;d.setAttribute('aria-hidden','true');im.replaceWith(d)}
},true);
</script>
<!--SITE_CONFIG-->
</head>
<body>
<main class="stage" id="stage">
  <div class="head">
    <span class="kicker">Recipes By Ninjas</span>
    <h1><span>What</span> <span>are we</span> <span>making?</span></h1>
    <form class="askbox" id="ask-home" aria-label="Ask Ninjas">
      <span class="who"><i aria-hidden="true"></i><span>Ask Ninjas</span></span>
      <input name="q" maxlength="400" placeholder="Tired? Leftovers? Tell me…" aria-label="Ask Ninjas what to make">
      <button type="submit" aria-label="Ask">➤</button>
    </form>
  </div>
  <a class="search" href="/search/" aria-label="Search all recipes">🔍</a>
  <div class="sun" aria-hidden="true"></div>
  <div id="ring" aria-hidden="true"></div>
  <img class="chef" id="chef" src="/img/home/ninja.webp" data-emo="🥷" alt="Our ninja chef">
  <div class="counter" aria-hidden="true"></div>
  <nav class="machines" aria-label="Choose a machine">
    <a class="machine c-ice" href="/creami/" data-k="creami" style="--d:.30s"><img class="m" src="/img/home/icecream-machine.webp" data-emo="🍦" alt=""><span class="label"><b>Ice cream</b><small>78 recipes</small></span></a>
    <a class="machine c-juice" href="/juicer/" data-k="juicer" style="--d:.38s"><img class="m" src="/img/home/juicer.webp" data-emo="🧃" alt=""><span class="label"><b>Juice</b><small>42 recipes</small></span></a>
    <span class="gap" aria-hidden="true"></span>
    <a class="machine c-blender" href="/blender/" data-k="blender" style="--d:.46s"><img class="m" src="/img/home/blender.webp" data-emo="🥤" alt=""><span class="label"><b>Blender</b><small>24 recipes</small></span></a>
    <a class="machine c-fire" href="/wood-fire/" data-k="wood-fire" style="--d:.54s"><img class="m" src="/img/home/grill.webp" data-emo="🔥" alt=""><span class="label"><b>Grill</b><small>24 recipes</small></span></a>
  </nav>
  <nav class="family" aria-label="Recipes by diet"><a href="/diet/keto/">🥑 Keto</a><a href="/diet/high-protein/">💪 Protein</a><a href="/diet/vegan/">🌱 Vegan</a><a href="/diet/dairy-free/">🥥 Dairy-free</a><a href="/diet/21-plus/">🍸 21+</a><a href="/gear/" class="x">🧰 Accessories</a></nav>
</main>
<script>
(function(){
  /* CDN copies (transparent PNGs) for when the build hasn't downloaded the images, e.g. local preview */
  var CDN='https://d8j0ntlcm91z4.cloudfront.net/user_3BSJ0wwhgjMymvG33oR0jOHcLjf/hf_20261002_';
  var SRC={ninja:'015047_1ecb3764-861c-4e1f-a86f-2d8bb558b94c','icecream-machine':'023312_43681c6b-3eda-4263-9ec1-5b785afd6ae6',juicer:'023312_98ba7198-3278-4beb-9680-7ed51e5f99db',
    blender:'023312_f5c50f42-417a-40db-a7c3-3c62adc7a64b',grill:'194703_1534ab96-f613-47ce-ad72-dc44b0d31ba8',
    strawberry:'023306_3c0041da-81fb-4638-8968-d7c0b2ab2fa6',banana:'023306_71cb8b2a-b92a-4c8c-94b8-06b52efa5362',blueberry:'023306_bc2c0400-01a7-4e84-bf2e-090f70c718f9',
    ice:'023306_c037e700-2921-4a60-878a-55bda902916e',orange:'023306_1820d910-8c14-4666-b607-e8ca3145821c',carrot:'023306_e28c674b-17b1-4b83-9f87-5e51e0d9e1b3',
    apple:'023306_ef141bfd-a3fe-49e7-b5c6-ad10daae6d3c',lemon:'023306_6acf6ff3-6568-48c8-b7f9-c457a5e421f4',pineapple:'023306_9d9e3a00-4885-4066-a1ff-9e549fee2981',
    spinach:'023306_506c20cb-ffde-4160-8106-921e5e8d012e',corn:'023306_0cc91537-d8c7-4786-a6a6-292e524fb848',pepper:'023312_ed92bdf9-f27b-4cdc-989f-6759d90812a1'};
  var EMO={strawberry:'🍓',banana:'🍌',blueberry:'🫐',ice:'🧊',orange:'🍊',carrot:'🥕',apple:'🍏',lemon:'🍋',pineapple:'🍍',spinach:'🥬',corn:'🌽',pepper:'🫑'};
  document.querySelectorAll('img[src^="/img/home/"]').forEach(function(im){var k=im.getAttribute('src').split('/').pop().replace('.webp','');if(SRC[k])im.dataset.cdn=CDN+SRC[k]+'.png'});

  /* Which ingredients belong to which machine */
  var RING=[['strawberry','creami'],['orange','juicer'],['pineapple','blender'],['corn','wood-fire'],['banana','creami'],['carrot','juicer'],
            ['spinach','blender'],['pepper','wood-fire'],['blueberry','creami'],['apple','juicer'],['ice','creami'],['lemon','juicer']];
  var stage=document.getElementById('stage'), ring=document.getElementById('ring'), chef=function(){return document.getElementById('chef')};
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items=RING.map(function(p,i){
    var im=document.createElement('img'); im.className='fl'; im.alt=''; im.src='/img/home/'+p[0]+'.webp';
    im.dataset.cdn=CDN+SRC[p[0]]+'.png'; im.dataset.emo=EMO[p[0]]; im.dataset.k=p[1];
    ring.appendChild(im);
    return {k:p[1], a:i/RING.length*Math.PI*2, r:i%2?1:.86, spin:(i%3-1)*25, el:function(){return ring.children[i]}, free:true};
  });

  /* geometry, recomputed on resize */
  var W,H,cx,cy,rx,ry;
  function measure(){var b=stage.getBoundingClientRect();W=b.width;H=b.height;cx=W/2;cy=H*.47;rx=Math.min(W*(W<600?.36:.42),560);ry=Math.min(rx*.3,H*.12)}
  measure(); addEventListener('resize',measure);

  /* the ninja steers: lean -1..1 pulls the ring toward a machine */
  var lean=0, leanTo=0, speed=reduce?0:.00022, speedTo=speed, t0=performance.now(), angle=0;
  function frame(now){
    var dt=Math.min(50,now-t0); t0=now;
    lean+=(leanTo-lean)*.06; speed+=(speedTo-speed)*.08; angle+=dt*speed;
    var ox=lean*rx*.38, tilt=lean*.18;
    items.forEach(function(it){
      if(!it.free)return;
      var th=it.a+angle, d=Math.sin(th);                  /* d>0: in front of the chef */
      var x=cx+ox+Math.cos(th)*rx*it.r, y=cy+d*ry*it.r+Math.cos(th)*rx*tilt*.35;
      var s=.72+(d+1)*.28, el=it.el(); if(!el)return;
      el.style.transform='translate3d('+x+'px,'+y+'px,0) translate(-50%,-50%) scale('+s.toFixed(3)+') rotate('+(th*it.spin).toFixed(1)+'deg)';
      el.style.zIndex=d>0?11+Math.round(d*8):Math.max(2,9+Math.round(d*6));
      el.classList.toggle('back',d<-.35);
      it.x=x; it.y=y; it.s=s;
    });
    if(!reduce)requestAnimationFrame(frame);
  }
  requestAnimationFrame(function(t){t0=t;frame(t);stage.classList.add('ready')});

  function aim(a){var m=a.getBoundingClientRect(), b=stage.getBoundingClientRect();return Math.max(-1,Math.min(1,((m.left+m.width/2-b.left)-W/2)/(W/2)))}
  function setLean(v){leanTo=v; var c=chef(); if(c)c.style.setProperty('--lean',(v*9).toFixed(1)+'deg')}

  var busy=false;
  document.querySelectorAll('.machine').forEach(function(a){
    a.addEventListener('pointerenter',function(){if(!busy)setLean(aim(a))});
    a.addEventListener('pointerleave',function(){if(!busy)setLean(0)});
    a.addEventListener('focus',function(){if(!busy)setLean(aim(a))});
    a.addEventListener('click',function(e){
      if(reduce||e.metaKey||e.ctrlKey||e.shiftKey||!Element.prototype.animate)return;
      e.preventDefault(); if(!busy)throwTo(a);
    });
  });

  /* Signature move: the ninja leans, hops, and throws this machine's ingredients off the ring into it. */
  function throwTo(a){
    busy=true; setLean(aim(a)); speedTo=.0012;
    var c=chef(); if(c){c.classList.remove('throw');void c.offsetWidth;c.classList.add('throw')}
    var m=a.querySelector('.m').getBoundingClientRect(), b=stage.getBoundingClientRect();
    var tx=m.left-b.left+m.width/2, ty=m.top-b.top+m.height*.2;
    var mine=items.filter(function(it){return it.k===a.dataset.k}), dur=620, gap=110;
    mine.forEach(function(it,i){
      setTimeout(function(){
        it.free=false; var el=it.el(); if(!el)return;
        var x0=it.x, y0=it.y, s0=it.s, apexY=Math.min(y0,ty)-H*.16, mx=(x0+tx)/2;
        el.style.zIndex=25;
        el.animate([
          {transform:'translate3d('+x0+'px,'+y0+'px,0) translate(-50%,-50%) scale('+s0+')'},
          {transform:'translate3d('+mx+'px,'+apexY+'px,0) translate(-50%,-50%) scale('+(s0*1.1)+') rotate(220deg)',offset:.45},
          {transform:'translate3d('+tx+'px,'+ty+'px,0) translate(-50%,-50%) scale(.2) rotate(460deg)',opacity:.3}
        ],{duration:dur,easing:'cubic-bezier(.4,0,.5,1)',fill:'forwards'});
      },260+i*gap);
    });
    var done=260+mine.length*gap+dur;
    setTimeout(function(){a.classList.add('go')},done-250);
    setTimeout(function(){location.href=a.href},done+380);
  }
  /* back button: show the scene fresh */
  addEventListener('pageshow',function(e){if(e.persisted)location.reload()});
})();
</script>
<!--SITE_JS-->
</body>
</html>
