# Cloudflare Pages has no scheduled functions, so this calls /api/send-ideas every hour.
# Set repository secrets SITE_URL (e.g. https://recipes-by-ninjas.pages.dev) and CRON_SECRET (same value as in Cloudflare).
# Without them it does nothing. Not needed on Netlify, which schedules send-ideas itself.
name: Tonight by Ninjas
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-ideas
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Not configured, skipping."; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/send-ideas"
